<!DOCTYPE html>
<html>

  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>MoWay — Vehicle-Agnostic Autonomy Trainer</title>
    <link rel="icon" href="data:,">

    <meta http-equiv="expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Mapbox GL JS v3 -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        width: min(440px, calc(100vw - 32px));
        z-index: 10;
        font-family: 'Share Tech Mono', monospace;
        color: #eaffff;
        font-size: 13px;
        letter-spacing: 0;
        text-shadow: 0 0 8px #001619;
        pointer-events: none;
      }
      .hud-panel {
        padding: 14px;
        background: rgba(1, 12, 18, 0.78);
        border: 1px solid rgba(0, 255, 247, 0.72);
        box-shadow: 0 0 18px rgba(0, 255, 247, 0.22);
      }
      .hud-kicker {
        color: #00fff7;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .hud-title {
        color: #ffffff;
        font-size: 24px;
        line-height: 1.05;
        margin-bottom: 8px;
      }
      .hud-copy {
        color: #bfeeff;
        line-height: 1.35;
        margin-bottom: 12px;
        text-transform: none;
      }
      .hud-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .hud-stat {
        min-height: 56px;
        padding: 8px;
        border: 1px solid rgba(191, 238, 255, 0.28);
        background: rgba(4, 24, 31, 0.72);
      }
      .hud-label {
        color: #86cfe5;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .hud-value {
        color: #ffffff;
        font-size: 18px;
      }
      .hud-wide {
        grid-column: 1 / -1;
      }
      .hud-reward {
        height: 8px;
        overflow: hidden;
        margin-top: 6px;
        border: 1px solid rgba(0, 255, 149, 0.5);
      }
      .hud-reward-fill {
        height: 100%;
        background: #00ff95;
      }
      .hud-controls {
        margin-top: 10px;
        color: #ffcc66;
        font-size: 11px;
      }
      #info {
        position: absolute;
        right: 20px;
        bottom: 20px;
        width: min(360px, calc(100vw - 40px));
        z-index: 30;
        padding: 14px;
        background: rgba(2, 13, 18, 0.88);
        border: 1px solid rgba(0, 255, 247, 0.72);
        box-shadow: 0 0 20px rgba(0, 255, 247, 0.18);
        color: #eaffff;
        font-family: 'Share Tech Mono', monospace;
        text-shadow: 0 0 8px #001619;
        pointer-events: none;
      }
      #info h3 {
        margin: 0 0 6px 0;
        color: #ffffff;
        font-size: 18px;
        letter-spacing: 0;
      }
      #info p {
        margin: 0 0 12px 0;
        color: #bfeeff;
        font-size: 12px;
        line-height: 1.35;
        text-transform: none;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .info-grid div {
        min-height: 52px;
        padding: 8px;
        border: 1px solid rgba(191, 238, 255, 0.24);
        background: rgba(4, 24, 31, 0.74);
      }
      .info-grid span {
        display: block;
        margin-bottom: 4px;
        color: #86cfe5;
        font-size: 10px;
      }
      .info-grid strong {
        color: #ffffff;
        font-size: 17px;
        font-weight: 400;
      }
      .info-foot {
        margin-top: 10px;
        color: #ffcc66;
        font-size: 11px;
        line-height: 1.3;
      }
      @media (max-width: 520px) {
        #hud {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
          font-size: 12px;
        }
        .hud-title {
          font-size: 20px;
        }
        .hud-grid {
          grid-template-columns: 1fr;
        }
        #info {
          right: 10px;
          bottom: 10px;
          width: calc(100vw - 20px);
        }
      }
    </style>

  </head>

  <body>

    <div id="map"></div>
    <div id="hud"></div>
    <div id="info">
      <h3>MoWay RL Training</h3>
      <p>Waiting for simulation...</p>
    </div>

    <script src="dist/main.js"></script>

  </body>
</html>
