<!DOCTYPE html>
<html>

  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>DriveBy — Vehicle-Agnostic Autonomy Trainer</title>

    <meta http-equiv="expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Mapbox GL JS v3 -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        width: min(440px, calc(100vw - 32px));
        z-index: 10;
        font-family: 'Share Tech Mono', monospace;
        color: #eaffff;
        font-size: 13px;
        letter-spacing: 0;
        text-shadow: 0 0 8px #001619;
        pointer-events: none;
      }
      .hud-panel {
        padding: 14px;
        background: rgba(1, 12, 18, 0.78);
        border: 1px solid rgba(0, 255, 247, 0.72);
        box-shadow: 0 0 18px rgba(0, 255, 247, 0.22);
      }
      .hud-kicker {
        color: #00fff7;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .hud-title {
        color: #ffffff;
        font-size: 24px;
        line-height: 1.05;
        margin-bottom: 8px;
      }
      .hud-copy {
        color: #bfeeff;
        line-height: 1.35;
        margin-bottom: 12px;
        text-transform: none;
      }
      .hud-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .hud-stat {
        min-height: 56px;
        padding: 8px;
        border: 1px solid rgba(191, 238, 255, 0.28);
        background: rgba(4, 24, 31, 0.72);
      }
      .hud-label {
        color: #86cfe5;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .hud-value {
        color: #ffffff;
        font-size: 18px;
      }
      .hud-wide {
        grid-column: 1 / -1;
      }
      .hud-reward {
        height: 8px;
        overflow: hidden;
        margin-top: 6px;
        border: 1px solid rgba(0, 255, 149, 0.5);
      }
      .hud-reward-fill {
        height: 100%;
        background: #00ff95;
      }
      .hud-controls {
        margin-top: 10px;
        color: #ffcc66;
        font-size: 11px;
      }
      @media (max-width: 520px) {
        #hud {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
          font-size: 12px;
        }
        .hud-title {
          font-size: 20px;
        }
        .hud-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

  </head>

  <body>

    <div id="map"></div>
    <div id="hud"></div>
    <div id="info" style="position:absolute; bottom:20px; right:20px; background:rgba(20,20,20,0.85); color:#fff; padding:15px; border-radius:8px; font-family:sans-serif; pointer-events:none; z-index:10; border:1px solid #444;">
      <h3 style="margin:0 0 5px 0;">DriveBy Agent View</h3>
      <p style="margin:0; font-size:14px; color:#ccc;">Multi-agent RL training environment.</p>
      <div style="font-size:0.9em;color:#aaa;margin-top:10px;">
        WASD/Arrows to drive<br>
        C to toggle camera view
      </div>
    </div>

    <script src="dist/main.js"></script>

  </body>
</html>
